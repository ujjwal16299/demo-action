name: Publish gatsby-card-component-package
on: [workflow_dispatch]


jobs:
  determine_version_and_publish:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"
      - name: npm install
        run: npm install --legacy-peer-deps
        env:
          GITHUB_TOKEN: ${{ env.NPM_PACKAGE }}
      - name: Install nx globally
        run: npm install -g nx
      - name: Determine Version and Publish
        if: ${{ inputs.package == 'Affected' }}
        run: |
          # Get the commit message from the environment variable
          commit_msg="${{ env.commit_msg }}"
          # Check if the commit message contains "major" or "minor"
          if echo "$commit_msg" | grep -qi "\[MAJOR\]"; then
            version="major"
            echo "Commit message indicates a MAJOR version bump."
          elif echo "$commit_msg" | grep -qi "\[MINOR\]"; then
            version="minor"
            echo "Commit message indicates a MINOR version bump."
          else
            version="patch"
            echo "Commit message does not indicate a MAJOR or MINOR version bump. Releasing PATCH version."
          fi
          echo version="$commit_msg" >> $GITHUB_ENV
          nx run-many -t publish --args="--version=$version"

  update_package_version:
    runs-on: ubuntu-latest
    needs: determine_version_and_publish
    if: ${{ always() }}
    steps:
      - name: Update Package Version
        if: ${{ needs.determine_version_and_publish.result == 'success' }}
        run: |
          # Get the version from the environment variable
          version="${{ env.version }}"
          npm version $version

      - name: Auto-commit Package Version Update
        if: ${{ needs.determine_version_and_publish.result == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update package version"
